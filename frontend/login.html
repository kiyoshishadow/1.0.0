<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Login - SICIS</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
      width: 100vw;
      min-height: 100vh;
      overflow-x: hidden;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      position: relative;
    }

    /* Fondo profesional con ondas suaves */
    .animated-background {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 25%, #cbd5e1 50%, #94a3b8 75%, #64748b 100%);
      background-size: 200% 200%;
      animation: subtleGradient 12s ease infinite;
      z-index: -3;
    }

    @keyframes subtleGradient {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* Ondas geométricas elegantes */
    .geometric-wave {
      position: absolute;
      opacity: 0.08;
      animation: gentleFloat 8s ease-in-out infinite;
    }

    .wave1 {
      width: 400px;
      height: 400px;
      top: -10%;
      left: -10%;
      background: linear-gradient(45deg, rgba(59, 130, 246, 0.1), rgba(147, 197, 253, 0.1));
      border-radius: 40% 60% 60% 40%;
      animation-delay: 0s;
    }

    .wave2 {
      width: 300px;
      height: 300px;
      top: 60%;
      right: -5%;
      background: linear-gradient(45deg, rgba(99, 102, 241, 0.1), rgba(196, 181, 253, 0.1));
      border-radius: 60% 40% 40% 60%;
      animation-delay: 3s;
    }

    .wave3 {
      width: 500px;
      height: 500px;
      bottom: -15%;
      left: 50%;
      background: linear-gradient(45deg, rgba(34, 197, 94, 0.08), rgba(134, 239, 172, 0.08));
      border-radius: 50% 50% 40% 60%;
      animation-delay: 6s;
    }

    @keyframes gentleFloat {
      0%, 100% {
        transform: translate(0, 0) rotate(0deg);
      }
      33% {
        transform: translate(20px, -15px) rotate(5deg);
      }
      66% {
        transform: translate(-15px, 10px) rotate(-3deg);
      }
    }

    /* Partículas sutiles tipo papel */
    .paper-particles {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: -2;
    }

    .paper-particle {
      position: absolute;
      background: rgba(255, 255, 255, 0.6);
      animation: paperFloat 8s linear infinite;
      border-radius: 2px;
    }

    @keyframes paperFloat {
      0% {
        transform: translateY(100vh) rotate(0deg);
        opacity: 0;
      }
      10% {
        opacity: 1;
      }
      90% {
        opacity: 1;
      }
      100% {
        transform: translateY(-10vh) rotate(360deg);
        opacity: 0;
      }
    }

    /* Líneas corporativas */
    .corporate-lines {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: -1;
    }

    .corp-line {
      position: absolute;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(59, 130, 246, 0.3), transparent);
      animation: corporateFlow 6s linear infinite;
    }

    .corp-line:nth-child(1) {
      top: 25%;
      width: 100%;
      animation-delay: 0s;
    }

    .corp-line:nth-child(2) {
      top: 50%;
      width: 100%;
      animation-delay: 2s;
    }

    .corp-line:nth-child(3) {
      top: 75%;
      width: 100%;
      animation-delay: 4s;
    }

    @keyframes corporateFlow {
      0% {
        transform: translateX(-100%);
        opacity: 0;
      }
      20% {
        opacity: 1;
      }
      80% {
        opacity: 1;
      }
      100% {
        transform: translateX(100%);
        opacity: 0;
      }
    }

    /* Formulario profesional */
    .login {
      width: 440px;
      max-width: 95vw;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.8);
      padding: 60px 45px;
      color: #1e293b;
      border-radius: 24px;
      font-size: 1.1em;
      box-shadow: 
        0 25px 50px rgba(0, 0, 0, 0.08),
        0 0 0 1px rgba(255, 255, 255, 0.1),
        inset 0 1px 0 rgba(255, 255, 255, 0.6);
      position: relative;
      z-index: 10;
      animation: professionalEntrance 1.2s cubic-bezier(0.165, 0.84, 0.44, 1);
    }

    @keyframes professionalEntrance {
      0% {
        opacity: 0;
        transform: translateY(30px) scale(0.95);
      }
      100% {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .login::before {
      content: '';
      position: absolute;
      top: -1px;
      left: -1px;
      right: -1px;
      bottom: -1px;
      background: linear-gradient(135deg, rgba(59, 130, 246, 0.2), rgba(147, 197, 253, 0.1), rgba(255, 255, 255, 0.1));
      border-radius: 25px;
      z-index: -1;
      animation: subtleBorderGlow 4s ease-in-out infinite;
    }

    @keyframes subtleBorderGlow {
      0%, 100% {
        opacity: 0.3;
      }
      50% {
        opacity: 0.6;
      }
    }

    /* Logo/Título corporativo */
    .h1 {
      text-align: center;
      margin-bottom: 45px;
      font-size: 2.2em;
      font-weight: 700;
      letter-spacing: 1px;
      color: #1e293b;
      position: relative;
      animation: titleFadeIn 1.5s ease-out;
    }

    .h1::before {
      content: '';
      position: absolute;
      bottom: -10px;
      left: 50%;
      transform: translateX(-50%);
      width: 60px;
      height: 3px;
      background: linear-gradient(90deg, #3b82f6, #60a5fa);
      border-radius: 2px;
      animation: underlineGrow 1.5s ease-out 0.5s both;
    }

    @keyframes titleFadeIn {
      0% {
        opacity: 0;
        transform: translateY(-20px);
      }
      100% {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes underlineGrow {
      0% {
        width: 0;
      }
      100% {
        width: 60px;
      }
    }

    /* Inputs profesionales */
    .input-group {
      position: relative;
      margin: 30px 0;
    }

    .login input[type="text"],
    .login input[type="password"] {
      display: block;
      border: 2px solid rgba(148, 163, 184, 0.2);
      outline: none;
      width: 100%;
      padding: 20px 25px;
      font-size: 1em;
      border-radius: 12px;
      background: rgba(248, 250, 252, 0.8);
      color: #1e293b;
      font-weight: 500;
      transition: all 0.3s cubic-bezier(0.165, 0.84, 0.44, 1);
      position: relative;
    }

    .login input[type="text"]::placeholder,
    .login input[type="password"]::placeholder {
      color: #64748b;
      font-weight: 400;
    }

    .login input:focus {
      border-color: #3b82f6;
      background: rgba(255, 255, 255, 0.95);
      transform: translateY(-2px);
      box-shadow: 
        0 10px 25px rgba(59, 130, 246, 0.1),
        0 0 0 3px rgba(59, 130, 246, 0.1);
    }

    .login input[type="text"] {
      animation: slideInFromLeft 0.8s cubic-bezier(0.165, 0.84, 0.44, 1);
    }

    .login input[type="password"] {
      animation: slideInFromLeft 1s cubic-bezier(0.165, 0.84, 0.44, 1);
    }

    @keyframes slideInFromLeft {
      0% {
        opacity: 0;
        transform: translateX(-30px);
      }
      100% {
        opacity: 1;
        transform: translateX(0);
      }
    }

    /* Botón corporativo elegante */
    .btn {
      background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%);
      color: #ffffff;
      padding: 18px 30px;
      font-size: 1.1em;
      font-weight: 600;
      border: none;
      margin-top: 35px;
      border-radius: 12px;
      width: 100%;
      cursor: pointer;
      letter-spacing: 0.5px;
      position: relative;
      overflow: hidden;
      transition: all 0.3s cubic-bezier(0.165, 0.84, 0.44, 1);
      animation: slideInFromBottom 1.2s cubic-bezier(0.165, 0.84, 0.44, 1);
      box-shadow: 0 8px 25px rgba(59, 130, 246, 0.25);
    }

    .btn::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
      transition: left 0.5s;
    }

    .btn:hover::before {
      left: 100%;
    }

    .btn:hover {
      background: linear-gradient(135deg, #1d4ed8 0%, #1e40af 100%);
      transform: translateY(-3px);
      box-shadow: 0 15px 35px rgba(59, 130, 246, 0.35);
    }

    .btn:active {
      transform: translateY(-1px);
      box-shadow: 0 5px 15px rgba(59, 130, 246, 0.25);
    }

    @keyframes slideInFromBottom {
      0% {
        opacity: 0;
        transform: translateY(30px);
      }
      100% {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Indicador de carga profesional */
    .loading {
      display: none;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
    }

    .spinner {
      width: 20px;
      height: 20px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-top: 2px solid #ffffff;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .btn.loading {
      color: transparent;
    }

    .btn.loading .loading {
      display: block;
    }

    /* Footer corporativo */
    .corporate-footer {
      position: absolute;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 0.9em;
      color: #64748b;
      opacity: 0.8;
      animation: fadeInUp 2s ease-out;
    }

    @keyframes fadeInUp {
      0% {
        opacity: 0;
        transform: translateX(-50%) translateY(20px);
      }
      100% {
        opacity: 0.8;
        transform: translateX(-50%) translateY(0);
      }
    }

    /* Responsive */
    @media only screen and (max-width: 600px) {
      .login {
        width: 90%;
        padding: 40px 30px;
      }
      
      .h1 {
        font-size: 1.8em;
        margin-bottom: 35px;
      }
      
      .login input[type="text"],
      .login input[type="password"] {
        padding: 16px 20px;
      }
      
      .btn {
        padding: 16px 25px;
        margin-top: 25px;
      }
    }

    /* Animación de éxito */
    .success {
      background: linear-gradient(135deg, #10b981 0%, #059669 100%) !important;
      animation: successPulse 0.6s ease-out;
    }

    @keyframes successPulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.05); }
      100% { transform: scale(1); }
    }

    /* Efecto de error */
    .error {
      animation: shake 0.5s ease-in-out;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      10%, 30%, 50%, 70%, 90% { transform: translateX(-8px); }
      20%, 40%, 60%, 80% { transform: translateX(8px); }
    }
  </style>
</head>
<body>
  <!-- Fondo corporativo -->
  <div class="animated-background"></div>
  
  <!-- Ondas geométricas -->
  <div class="geometric-wave wave1"></div>
  <div class="geometric-wave wave2"></div>
  <div class="geometric-wave wave3"></div>

  <!-- Líneas corporativas -->
  <div class="corporate-lines">
    <div class="corp-line"></div>
    <div class="corp-line"></div>
    <div class="corp-line"></div>
  </div>

  <!-- Partículas tipo papel -->
  <div class="paper-particles" id="paperContainer"></div>

  <form class="login" id="loginForm" autocomplete="off">
    <div class="h1">SICIS</div>
    
    <div class="input-group">
      <input 
        pattern="^[a-zA-Z0-9]+$" 
        placeholder="👤 Usuario" 
        id="usuario" 
        name="usuario" 
        type="text" 
        required
      >
    </div>
    
    <div class="input-group">
      <input 
        placeholder="🔒 Contraseña" 
        id="password" 
        name="password" 
        type="password" 
        required
      >
    </div>
    
    <button class="btn" type="submit">
      <span class="btn-text">Iniciar Sesión</span>
      <div class="loading">
        <div class="spinner"></div>
      </div>
    </button>
  </form>

  <div class="corporate-footer">
    © 2026 SISTEMA INFORMÁTICO DE CONTROL DE IMPRESIONES Y SUMINISTROS - SICIS
  </div>

  <script>
    // Crear partículas tipo papel sutiles
    function createPaperParticle() {
      const particle = document.createElement('div');
      particle.className = 'paper-particle';
      
      const width = Math.random() * 6 + 3;
      const height = Math.random() * 8 + 4;
      
      particle.style.width = width + 'px';
      particle.style.height = height + 'px';
      particle.style.left = Math.random() * 100 + '%';
      particle.style.animationDuration = (Math.random() * 4 + 6) + 's';
      particle.style.animationDelay = Math.random() * 2 + 's';
      
      document.getElementById('paperContainer').appendChild(particle);
      
      setTimeout(() => {
        particle.remove();
      }, 10000);
    }

    // Crear partículas cada 2 segundos
    setInterval(createPaperParticle, 2000);

    // Pre-cargar sesión
    async function precargarDatos() {
        try {
            const fechaActual = new Date().toISOString().split('T')[0];
            localStorage.setItem('fechaActual', fechaActual);
        } catch (error) {
            console.log('Error pre-cargando datos:', error);
        }
    }

    // Iniciar pre-carga inmediatamente al cargar login
    precargarDatos();

    // Manejo del formulario
    document.getElementById('loginForm').addEventListener('submit', async function(event) {
      event.preventDefault();
      
      const btn = document.querySelector('.btn');
      const usuario = document.getElementById('usuario').value;
      const password = document.getElementById('password').value;
      
      if (!usuario || !password) {
        btn.classList.add('error');
        setTimeout(() => {
          btn.classList.remove('error');
        }, 500);
        return;
      }
      
      // Efecto de carga
      btn.classList.add('loading');
      btn.disabled = true;
      
      try {
        const response = await fetch(`${window.location.origin}/login`, {
          method: 'POST',
          credentials: 'include',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({ usuario, password })
        });
        
        const data = await response.json();
        
        if (response.ok) {
          // Guardar información del usuario en localStorage
          localStorage.setItem('userInfo', JSON.stringify(data.user));
          
          // Animación de éxito
          btn.classList.add('success');
          btn.querySelector('.btn-text').textContent = '¡Acceso Concedido!';
          
          // Crear efecto de éxito con partículas
          createSuccessEffect();
          
          setTimeout(() => {
            window.location.href = 'index.html';
          }, 1500);
        } else {
          throw new Error(data.error || 'Error de autenticación');
        }
      } catch (error) {
        console.error('Error de login:', error);
        btn.classList.remove('loading');
        btn.disabled = false;
        btn.classList.add('error');
        btn.querySelector('.btn-text').textContent = 'Error de Acceso';
        
        setTimeout(() => {
          btn.classList.remove('error');
          btn.querySelector('.btn-text').textContent = 'Iniciar Sesión';
        }, 2000);
      }
    });

    // Efecto de éxito con partículas blancas
    function createSuccessEffect() {
      for (let i = 0; i < 15; i++) {
        setTimeout(() => {
          createPaperParticle();
        }, i * 100);
      }
    }

    // Efectos suaves en los inputs
    const inputs = document.querySelectorAll('input[type="text"], input[type="password"]');
    inputs.forEach(input => {
      input.addEventListener('focus', function() {
        this.parentElement.style.transform = 'scale(1.01)';
      });
      
      input.addEventListener('blur', function() {
        this.parentElement.style.transform = 'scale(1)';
      });
    });

    // Efecto parallax sutil
    document.addEventListener('mousemove', function(e) {
      const waves = document.querySelectorAll('.geometric-wave');
      const mouseX = e.clientX / window.innerWidth;
      const mouseY = e.clientY / window.innerHeight;
      
      waves.forEach((wave, index) => {
        const speed = (index + 1) * 0.005;
        const x = (mouseX - 0.5) * speed * 50;
        const y = (mouseY - 0.5) * speed * 50;
        
        wave.style.transform += ` translate(${x}px, ${y}px)`;
      });
    });

  </script>
</body>
</html>
